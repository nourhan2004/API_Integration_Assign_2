<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Currency App</title>

<style>
/* 🌈 الخلفية */
body {
    margin: 0;
    font-family: Arial, sans-serif;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, #1e3c72, #2a5298);
}

/* 📦 الكارد */
.container {
    background: white;
    padding: 30px;
    width: 350px;
    border-radius: 20px;
    box-shadow: 0px 10px 25px rgba(0,0,0,0.3);
    text-align: center;
}

/* 🏷️ العنوان */
h1 {
    color: #2a5298;
    margin-bottom: 20px;
}

/* ✍️ input */
input {
    width: 90%;
    padding: 12px;
    border: 2px solid #ddd;
    border-radius: 10px;
    outline: none;
    margin-bottom: 15px;
    transition: 0.3s;
}

input:focus {
    border-color: #2a5298;
}

/* 🔘 الزر */
button {
    width: 100%;
    padding: 12px;
    background: #2a5298;
    color: white;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    font-size: 16px;
    transition: 0.3s;
}

button:hover {
    background: #1e3c72;
    transform: scale(1.03);
}

/* 📊 النتائج */
.result {
    margin-top: 20px;
    text-align: left;
    background: #f4f6f8;
    padding: 15px;
    border-radius: 10px;
}

.result p {
    margin: 8px 0;
}
</style>
</head>

<body>

<div class="container">

    <h1>🌍 Currency App</h1>

    <input type="text" id="country" placeholder="Enter country name">

    <button onclick="getData()">Get Info</button>

    <div class="result" id="result">
        <p>Results will appear here...</p>
    </div>

</div>
<script src="app2.js"></script>

</body>
</html>
